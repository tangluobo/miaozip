name: Build desktop binaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: i686-pc-windows-msvc
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      CARGO_BUILD_JOBS: 2

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config \
            libgtk-3-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libssl-dev liblzma-dev rpm file

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolPath = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install --tool-path $toolPath wix --version 5.0.2
          "WIX_EXE=$(Join-Path $toolPath 'wix.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package Windows distributions
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging\windows\package.ps1 -Target '${{ matrix.target }}' -WixExe $env:WIX_EXE

      - name: Package Linux distributions
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/linux/package.sh '${{ matrix.target }}'

      - name: Package macOS distributions
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/macos/package.sh '${{ matrix.target }}'

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miaozip-${{ matrix.target }}-packages
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14
