[package]
name = "miaozip"
version = "0.1.0"
edition = "2024"
description = "A cross-platform archive desktop utility built with Rust and egui"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "persistence",
    "wayland",
    "wgpu",
    "x11",
] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
walkdir = "2.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
bzip2 = "0.6"
xz2 = "0.1"
zstd = "0.13"
sevenz-rust2 = { version = "0.22.2", features = ["compress", "util"] }
tempfile = "3"
md-5 = "0.11"
sha2 = "0.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(not(all(windows, target_arch = "x86")))'.dependencies]
unrar = "0.5.8"

# `unrar` 0.5.8 declares UnRAR's PASCAL API as `extern "C"`. Those ABIs only
# differ on 32-bit Windows, where the bad declarations fail to link. Use the
# same bundled UnRAR engine through a small, correctly typed adapter there.
[target.'cfg(all(windows, target_arch = "x86"))'.dependencies]
unrar_sys = { version = "0.5.8", features = ["std"] }

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
winres = "0.1"

[profile.release]
lto = "thin"
strip = true
